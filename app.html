<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ceritain · Buddy karier kamu</title>
<meta name="t-title" content="a.title">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M22 54 L28 12 L56 34 Z M98 54 L92 12 L64 34 Z' fill='%23FFC93C'/%3E%3Cellipse cx='60' cy='70' rx='47' ry='40' fill='%23FFC93C'/%3E%3Ccircle cx='43' cy='64' r='7' fill='%231F2340'/%3E%3Ccircle cx='77' cy='64' r='7' fill='%231F2340'/%3E%3Cpath d='M55 74 H65 L60 80 Z' fill='%23F07A8E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap">
<script src="/lib/jspdf.umd.min.js"></script>
<script src="/lib/i18n.js"></script>
<script src="/lib/buddies.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Theme colors. They change when the user picks a buddy (see BUDDIES below). */
  :root{
    --accent:#3F5EF0; --accent-dark:#2C46C4; --soft:#EEF2FF; --bg:#EAF2FF; --body:#FFD84D;
    --ink:#1F2340; --muted:#4A4F70; --line:#E3E6F3; --white:#fff; --note-bg:#FFF3C4; --note-ink:#5A4300;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;transition:background .4s}
  button,input,select{font:inherit}
  button{cursor:pointer}
  .app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--white);box-shadow:0 0 40px rgba(31,35,64,.08)}
  .screen{display:none;flex:1;flex-direction:column;min-height:0;overflow-y:auto}
  #s-chat{overflow:hidden}
  .screen.on{display:flex}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px}
  .brand{font-family:var(--head,inherit);font-weight:900;font-size:19px;display:flex;align-items:center;gap:8px}
  .link{background:none;border:none;color:var(--accent);font-weight:800;font-size:14px;padding:10px 4px;min-height:44px}
  .pill{background:var(--soft);color:var(--accent);border:none;border-radius:999px;padding:10px 14px;font-weight:800;font-size:14px;min-height:44px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:var(--btn-bd,0 solid transparent);border-radius:var(--btn,28px);box-shadow:var(--btn-sh,none);background:var(--accent);color:#fff;font-size:17px;font-weight:800;transition:transform .1s,background .2s}
  .btn:hover{background:var(--accent-dark)} .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:var(--soft);color:var(--accent)}
  .pad{padding:8px 22px 24px}
  h1{font-family:var(--head,inherit);font-size:30px;line-height:1.15;font-weight:900;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:16px;line-height:1.5;margin:8px 0 0}
  .banner{display:none;background:#FFF4D6;color:#5C4400;font-size:13px;font-weight:700;text-align:center;padding:8px 16px}
  .error{color:#B3261E;font-size:14px;font-weight:700;min-height:0}
  .error:empty{display:none}
  .ok{color:#14613A;background:#E3F6EA;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;line-height:1.45}
  .ok:empty{display:none}
  .trio{display:flex;justify-content:center;gap:4px;margin:4px 0 14px}
  .tabs{display:flex;background:#F1F3FB;border-radius:999px;padding:4px;margin:18px 0 16px}
  .tabs button{flex:1;border:none;background:none;border-radius:999px;min-height:44px;font-weight:800;font-size:15px;color:var(--muted)}
  .tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(31,35,64,.1)}
  a.brand{color:inherit;text-decoration:none}
  a.link{display:inline-flex;align-items:center}
  .langToggle{display:inline-flex;align-items:center;gap:2px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px;font:inherit;font-size:13px;font-weight:800;min-height:36px;cursor:pointer}
  .langToggle b,.langToggle span{padding:4px 8px;border-radius:999px}
  .langToggle b{background:var(--accent);color:#fff}
  .langToggle span{color:var(--muted)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* 1. Pick a buddy */
  .buddies{display:flex;flex-direction:column;gap:14px;margin:22px 0}
  .buddy{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;border-radius:24px;border:3px solid var(--line);background:#fff;color:var(--ink);transition:border-color .2s,transform .15s}
  .buddy:hover{transform:translateY(-2px)}
  .buddy[aria-pressed="true"]{border-color:var(--b-accent);background:var(--b-soft)}
  .buddy .art{flex:none;width:84px;height:84px;border-radius:22px;background:var(--b-soft);display:flex;align-items:center;justify-content:center}
  .buddy[aria-pressed="true"] .art{background:#fff}
  .buddy .name{font-size:21px;font-weight:900}
  .buddy .tag{font-size:14px;color:var(--muted);font-weight:700;margin-top:1px}
  .traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .traits span{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:#fff;color:var(--b-accent);border:1.5px solid var(--b-accent)}
  .theme-line{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;font-weight:800;color:var(--muted)}
  .theme-line i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .say{margin-top:8px;font-size:14px;font-style:italic;color:var(--muted)}

  /* 2. Profile */
  .hello{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
  .hello .bubble{background:var(--soft);border-radius:20px 20px 20px 6px;padding:12px 14px;font-size:15px;font-weight:700;line-height:1.4}
  form.fields{display:flex;flex-direction:column;gap:14px}
  .field label{display:block;font-size:14px;font-weight:800;margin-bottom:6px}
  .field label small{font-weight:600;color:var(--muted)}
  .field input,.field select{width:100%;height:52px;border-radius:16px;border:2px solid var(--line);background:#F7F8FC;padding:0 16px;font-size:16px;color:var(--ink);outline:none}
  .field input:focus,.field select:focus{border-color:var(--accent);background:#fff}
  .row2{display:flex;gap:12px} .row2 .field{flex:1;min-width:0}
  .more{font-size:14px;font-weight:800;color:var(--muted);margin-top:4px}

  /* 3. Chat */
  .chat-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff}
  .chat-head .who{flex:1;min-width:0}
  .chat-head .who b{font-family:var(--head,inherit);font-size:17px;font-weight:900}
  .dots{display:flex;gap:5px;margin-top:6px}
  .dots span{width:22px;height:7px;border-radius:4px;background:var(--line);transition:background .3s}
  .dots span.on{background:var(--accent)}
  .msgs{flex:1;min-height:0;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
  .m{max-width:82%;padding:13px 16px;font-size:16px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;animation:pop .25s ease-out}
  .m.bot{align-self:flex-start;background:#fff;border-radius:var(--bub);border:var(--bd);box-shadow:var(--sh)}
  .m.me{align-self:flex-end;background:var(--accent);color:#fff;border-radius:var(--me);border:var(--bd)}
  .note{align-self:flex-start;display:flex;gap:8px;align-items:flex-start;background:var(--note-bg);color:var(--note-ink);border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.4;max-width:88%;animation:pop .3s ease-out}
  .note b{display:block;font-size:12px;letter-spacing:.04em}
  .typing{align-self:flex-start;background:#fff;border-radius:22px;padding:14px 18px;display:flex;gap:5px}
  .typing i{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.4;animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{50%{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{border:none;background:#fff;color:var(--accent);font-weight:800;font-size:15px;padding:10px 16px;border-radius:var(--chip);border:var(--bd);min-height:44px;box-shadow:0 2px 6px rgba(31,35,64,.08)}
  .ready{display:none;margin:0 16px 10px;background:var(--soft);border-radius:20px;padding:12px;align-items:center;gap:12px}
  .ready.on{display:flex}
  .ready span{flex:1;font-weight:800;font-size:14px}
  .ready .btn{width:auto;min-height:48px;padding:0 18px;font-size:15px}
  .composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
  .composer textarea{flex:1;min-width:0;min-height:52px;max-height:140px;resize:none;border:none;border-radius:26px;background:#F1F3FB;padding:15px 20px;font-size:16px;line-height:1.35;color:var(--ink);outline-color:var(--accent);font-family:inherit}
  .send{flex:none;width:52px;height:52px;border-radius:50%;border:none;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}

  /* 4. Resume */
  .done-head{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
  .done-head h1{font-size:26px}
  .paper-wrap{position:relative;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 4px 18px rgba(31,35,64,.1);border:1px solid var(--line)}
  .paper{padding:26px 22px;font-family:'Source Serif 4',Georgia,serif;color:#1D1D20;min-height:320px}
  .locked .blurme{filter:blur(5px);user-select:none;pointer-events:none}
  .fade{display:none;position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 85%)}
  .locked .fade{display:block}
  .r-name{font-size:24px;font-weight:700}
  .r-head{font-size:15px;color:#45454C}
  .r-contact{font-family:'Nunito',sans-serif;font-size:12px;color:var(--muted);margin-top:4px}
  .r-sec{margin-top:18px;font-family:'Nunito',sans-serif;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px}
  .r-item{margin-top:10px}
  .r-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .r-role{font-weight:700;font-size:15px}
  .r-date{font-family:'Nunito',sans-serif;font-size:12px;color:var(--muted)}
  .r-org{font-style:italic;font-size:14px;color:#45454C}
  .paper ul{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.55}
  .paper p{font-size:14px;line-height:1.55;margin:8px 0 0}
  .paper ul ul{margin-top:2px;list-style:circle}
  .r-when{font-size:14px;margin-top:4px}
  .r-when .r-date{font-size:13px}
  .r-glabel{font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;margin-top:6px}
  .price-row{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 12px}
  .price-row b{font-size:24px;font-weight:900}
  .small{font-size:13px;color:var(--muted);font-weight:700;text-align:center;margin-top:10px}
  .actions{display:flex;flex-direction:column;gap:10px}

  /* Payment popup */
  .modal-bg{position:fixed;inset:0;background:rgba(20,22,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .modal-bg.on{display:flex}
  .modal{background:#fff;width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:24px 22px calc(26px + env(safe-area-inset-bottom));animation:pop .25s ease-out}
  .tag-test{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.08em;background:#FFF4D6;color:#5C4400;padding:4px 8px;border-radius:6px}
  .modal h2{margin:10px 0 2px;font-size:22px;font-weight:900}
  .modal .big{font-size:32px;font-weight:900;margin:8px 0}
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:var(--muted);font-weight:600;text-align:left}
  .consent input{flex:none;width:22px;height:22px;margin-top:1px;accent-color:var(--accent)}
  .consent a{color:var(--accent);font-weight:800}
  .acc-email{font-weight:800;margin:4px 0 16px;word-break:break-all}
  .acc-list{display:flex;flex-direction:column;gap:10px}
  .btn.danger{background:#FDECEA;color:#B3261E;box-shadow:none;border:0}
  .acc-links{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:14px}
  .acc-links a{color:var(--accent);font-weight:800}
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="demoBanner" data-t="a.demo"></div>

  <!-- 0. SIGN UP / LOG IN (only when accounts are switched on) -->
  <section class="screen" id="s-auth" aria-labelledby="authTitle">
    <div class="top"><a class="link" href="/" style="text-decoration:none" data-t="a.backHome"></a><button class="langToggle" type="button"></button></div>
    <div class="pad" style="flex:1;display:flex;flex-direction:column">
      <div class="trio" id="authTrio"></div>
      <h1 id="authTitle" style="text-align:center"></h1>
      <p class="sub" id="authSub" style="text-align:center"></p>
      <div class="tabs" id="authTabs" role="tablist">
        <button type="button" role="tab" id="tabUp" data-t="a.tabUp"></button>
        <button type="button" role="tab" id="tabIn" data-t="a.tabIn"></button>
      </div>
      <form class="fields" id="authForm" novalidate>
        <div class="field" id="emailField"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" inputmode="email" required></div>
        <div class="field" id="pwField"><label for="a-pass" data-t="a.pass"></label><input id="a-pass" type="password" autocomplete="new-password" minlength="8" required></div>
        <label class="consent" id="consentField"><input type="checkbox" id="a-consent"><span data-t="a.consent"></span></label>
        <div class="error" id="authErr" role="alert"></div>
        <div class="ok" id="authOk" role="status"></div>
        <button class="btn" type="submit" id="authBtn"></button>
        <button class="link" type="button" id="forgot" style="align-self:center"></button>
      </form>
    </div>
  </section>

  <!-- CONSENT (accounts made before the privacy policy existed) -->
  <section class="screen" id="s-consent" aria-labelledby="csTitle">
    <div class="top"><a class="link" href="/" style="text-decoration:none" data-t="a.home"></a><button class="langToggle" type="button"></button></div>
    <div class="pad" style="flex:1;display:flex;flex-direction:column;gap:14px">
      <div class="trio" id="csMascot"></div>
      <h1 id="csTitle" style="text-align:center" data-t="a.csH"></h1>
      <p class="sub" style="text-align:center" data-t="a.csP"></p>
      <label class="consent"><input type="checkbox" id="cs-consent"><span data-t="a.consent"></span></label>
      <div class="error" id="csErr" role="alert"></div>
      <button class="btn" id="csBtn" data-t="a.csBtn"></button>
      <button class="link" id="csLogout" style="align-self:center" data-t="a.logout"></button>
    </div>
  </section>

  <!-- 1. PICK A BUDDY -->
  <section class="screen" id="s-pick" aria-labelledby="pickTitle">
    <div class="top"><a class="link" href="/" style="text-decoration:none" data-t="a.home"></a><button class="langToggle" type="button"></button><button class="pill" id="accountBtn" hidden data-t="a.account"></button></div>
    <div class="pad" style="flex:1;display:flex;flex-direction:column">
      <h1 id="pickTitle" data-t="a.pickH"></h1>
      <p class="sub" data-t="a.pickP"></p>
      <div class="buddies" id="buddyList"></div>
      <div style="flex:1"></div>
      <button class="btn" id="pickNext"></button>
    </div>
  </section>

  <!-- 2. PROFILE -->
  <section class="screen" id="s-profile" aria-labelledby="profTitle">
    <div class="top"><button class="link" data-go="pick" data-t="a.change"></button><button class="langToggle" type="button"></button></div>
    <div class="pad">
      <div class="hello"><span id="profMascot"></span><div class="bubble" id="profHello"></div></div>
      <h1 id="profTitle" class="sr" data-t="a.details"></h1>
      <form class="fields" id="profileForm" novalidate>
        <div class="field"><label for="f-name" data-t="a.fname"></label><input id="f-name" autocomplete="name" required></div>
        <div class="field"><label for="f-nick" id="nickLabel"></label><input id="f-nick" autocomplete="nickname" required></div>
        <div class="field"><label for="f-target" data-t="a.target"></label><input id="f-target" data-t-ph="a.targetPh"></div>
        <div class="row2">
          <div class="field"><label for="f-city" data-t="a.city"></label><input id="f-city" autocomplete="address-level2"></div>
          <div class="field"><label for="f-lang" data-t="a.cvlang"></label><select id="f-lang"><option>Bahasa Indonesia</option><option>English</option></select></div>
        </div>
        <div class="field"><label for="f-email">Email</label><input id="f-email" type="email" autocomplete="email" inputmode="email"></div>
        <div class="field"><label for="f-phone" data-t="a.phone"></label><input id="f-phone" type="tel" autocomplete="tel" inputmode="tel"></div>
        <div class="field"><label for="f-linkedin" data-t="a.linkedin"></label><input id="f-linkedin" placeholder="linkedin.com/in/…"></div>
        <div class="error" id="profErr" role="alert"></div>
        <button class="btn" type="submit" id="profNext" data-t="a.startChat"></button>
        <p class="small" style="margin:0" data-t="a.freeNote"></p>
      </form>
    </div>
  </section>

  <!-- 3. CHAT -->
  <section class="screen" id="s-chat" aria-label="Chat">
    <div class="chat-head">
      <span id="chatMascot"></span>
      <div class="who"><b id="chatName"></b><div class="dots" id="dots"></div></div>
      <button class="pill" id="peek" data-t="a.myCv"></button>
      <button class="link" id="restart" data-t="a.restart" data-t-aria="a.restartAria"></button>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="ready" id="readyBar"><span id="readyText"></span><button class="btn" id="create" data-t="a.create"></button></div>
    <div class="error" id="chatErr" role="alert" style="padding:0 16px 8px"></div>
    <form class="composer" id="composer">
      <label for="input" class="sr" data-t="a.yourAnswer"></label>
      <textarea id="input" rows="1" data-t-ph="a.typeHere"></textarea>
      <button class="send" type="submit" data-t-aria="a.send"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg></button>
    </form>
  </section>

  <!-- 4. RESUME -->
  <section class="screen" id="s-cv" aria-labelledby="cvTitle">
    <div class="top"><button class="link" data-go="chat" data-t="a.backChat"></button><div class="brand" data-t="brand"></div></div>
    <div class="pad">
      <div class="done-head"><span id="cvMascot"></span><h1 id="cvTitle"></h1></div>
      <div class="paper-wrap" id="paperWrap"><div class="paper" id="paper"></div><div class="fade"></div></div>
      <div id="payBox">
        <div class="price-row"><span style="font-weight:800" data-t="a.unlockRow"></span><b class="priceText"></b></div>
        <button class="btn" id="unlock" data-t="a.unlock"></button>
        <p class="small" data-t="a.payNote"></p>
      </div>
      <div id="paidBox" class="actions" style="display:none;margin-top:18px">
        <button class="btn" id="download" data-t="a.download"></button>
        <button class="btn ghost" id="redo" data-t="a.redo"></button>
      </div>
      <div class="error" id="cvErr" role="alert"></div>
    </div>
  </section>
</div>

<div class="modal-bg" id="modal" role="dialog" aria-modal="true" aria-labelledby="payTitle">
  <div class="modal">
    <span class="tag-test" data-t="a.testMode"></span>
    <h2 id="payTitle" data-t="a.payTitle"></h2>
    <div class="big priceText"></div>
    <p class="sub" style="font-size:14px;margin-bottom:16px" data-t="a.payNot"></p>
    <div class="actions">
      <button class="btn" id="fakePay" data-t="a.fakePay"></button>
      <button class="btn ghost" id="cancelPay" data-t="a.cancel"></button>
    </div>
    <p class="error" id="payErr" role="alert"></p>
  </div>
</div>

<div class="modal-bg" id="accModal" role="dialog" aria-modal="true" aria-labelledby="accTitle">
  <div class="modal">
    <h2 id="accTitle" data-t="a.accH"></h2>
    <div class="acc-email" id="accEmail"></div>
    <div class="acc-list">
      <button class="btn ghost" id="accDl" data-t="a.accDl"></button>

/* ================= State (saved on this device) ================= */

const fresh = () => ({ screen:"pick", buddy:"kira", profile:{}, messages:[], notes:{}, covered:{}, ready:false, suggestions:[], mood:"happy", resume:null, paid:false, cvId:null });
let S = (() => { try { return Object.assign(fresh(), JSON.parse(localStorage.getItem("storycv2")) || {}); } catch(e){ return fresh(); } })();
if (!BUDDIES[S.buddy]) S = fresh();
let sb = null, session = null;   // login service + the logged-in user (when accounts are switched on)
const save = () => { try { localStorage.setItem("storycv2", JSON.stringify(S)); } catch(e){} };
const priceLabel = "Rp " + PRICE_IDR.toLocaleString("id-ID");

function applyTheme(){
  if (!BUDDIES[S.buddy]) S.buddy = "kira";
  const t = BUDDIES[S.buddy].theme, r = document.documentElement.style;
  const map = { "--accent":t.accent, "--accent-dark":t.dark, "--soft":t.soft, "--bg":t.bg, "--note-bg":t.pop, "--note-ink":t.popInk,
    "--head":t.head, "--bub":t.bub, "--me":t.me, "--bd":t.bd, "--sh":t.sh, "--chip":t.chip, "--btn":t.btn, "--btn-bd":t.btnBd, "--btn-sh":t.btnSh };
  for (const k in map) r.setProperty(k, map[k]);
}
function go(screen){
  if (sb && !session) screen = "auth";          // must be logged in to use the tool
  if (screen === "auth" && !sb) screen = "pick";
  if (sb && session && !hasConsent() && screen !== "auth") screen = "consent";   // UU PDP: agree before anything is processed
  if (screen !== "auth" && screen !== "consent"){ S.screen = screen; save(); }
  document.querySelectorAll(".screen").forEach((el) => el.classList.toggle("on", el.id === "s-" + screen));
  ({ auth:renderAuth, consent:renderConsent, pick:renderPick, profile:renderProfile, chat:renderChat, cv:renderCV })[screen]();
  $("s-" + screen).scrollTop = 0;
}
document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));

async function post(url, body){ return api(url, { method:"POST", body:JSON.stringify(body) }); }
async function get(url){ return api(url, { method:"GET" }); }
async function api(url, opts){
  const headers = { "content-type":"application/json", "x-lang": I18N.lang };
  if (sb){ const { data } = await sb.auth.getSession(); if (data.session) headers.Authorization = "Bearer " + data.session.access_token; }
  const res = await fetch(url, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && sb){ session = null; authMode = "in"; go("auth"); $("authErr").textContent = data.error || T("a.loginAgain"); }
  if (!res.ok) throw new Error(data.error || T("a.oops"));
  if (data.demo) $("demoBanner").style.display = "block";
  return data;
}

/* ================= 0. Sign up / Log in ================= */
let authMode = new URLSearchParams(location.search).get("mode") === "login" ? "in" : "up";
const AUTH_TEXT = {
  up:      ["a.upH", "a.upP", "a.upBtn"],
  in:      ["a.inH", "a.inP", "a.inBtn"],
  forgot:  ["a.fgH", "a.fgP", "a.fgBtn"],
  newpass: ["a.npH", "a.npP", "a.npBtn"],
};
function renderAuth(){
  applyTheme();
  const mood = { up:"happy", in:"wink", forgot:"think", newpass:"think" }[authMode];
  $("authTrio").innerHTML = ["kira","kopi","tobi"].map((id) => mascot(id, mood, 64)).join("");
  const [t, sub, btn] = AUTH_TEXT[authMode].map((k) => T(k));
  $("authTitle").textContent = t; $("authSub").textContent = sub; $("authBtn").textContent = btn;
  $("tabUp").setAttribute("aria-selected", authMode === "up"); $("tabIn").setAttribute("aria-selected", authMode === "in");
  $("authTabs").style.display = (authMode === "up" || authMode === "in") ? "flex" : "none";
  $("emailField").style.display = authMode === "newpass" ? "none" : "block";
  $("pwField").style.display = authMode === "forgot" ? "none" : "block";
  $("consentField").style.display = authMode === "up" ? "flex" : "none";
  $("a-pass").setAttribute("autocomplete", authMode === "in" ? "current-password" : "new-password");
  $("forgot").textContent = authMode === "forgot" ? T("a.backLogin") : T("a.forgot");
  $("forgot").style.display = authMode === "newpass" ? "none" : "";
}
function setAuthMode(m){ authMode = m; $("authErr").textContent = ""; $("authOk").textContent = ""; renderAuth(); }
$("tabUp").addEventListener("click", () => setAuthMode("up"));
$("tabIn").addEventListener("click", () => setAuthMode("in"));
$("forgot").addEventListener("click", () => setAuthMode(authMode === "forgot" ? "in" : "forgot"));
function friendly(msg){
  msg = String(msg || "");
  if (/invalid login/i.test(msg)) return T("a.eWrong");
  if (/not confirmed/i.test(msg)) return T("a.eConfirm");
  if (/already registered|already been registered/i.test(msg)) return T("a.eExists");
  if (/rate limit|too many/i.test(msg)) return T("a.eTooMany");
  return msg || T("a.oops");
}
$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("authErr").textContent = ""; $("authOk").textContent = "";
  const email = $("a-email").value.trim(), pass = $("a-pass").value;
  if (authMode !== "newpass" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ $("authErr").textContent = T("a.eEmail"); return $("a-email").focus(); }
  if (authMode !== "forgot" && pass.length < 8){ $("authErr").textContent = T("a.ePass"); return $("a-pass").focus(); }
  if (authMode === "up" && !$("a-consent").checked){ $("authErr").textContent = T("a.eConsent"); return $("a-consent").focus(); }
  const btn = $("authBtn"), label = btn.textContent; btn.disabled = true; btn.textContent = T("a.wait");
  const back = location.origin + "/app";
  try {
    if (authMode === "up"){
      const { data, error } = await sb.auth.signUp({ email, password:pass, options:{ emailRedirectTo:back, data:consentRecord() } });
      if (error) throw error;
      if (data.session){ session = data.session; start(); }
      else { $("authOk").textContent = T("a.sent", { email }); }
    } else if (authMode === "in"){
      const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
      if (error) throw error;
      session = data.session; start();
    } else if (authMode === "forgot"){
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo:back });
      if (error) throw error;
      $("authOk").textContent = T("a.resetSent", { email });
    } else {
      const { error } = await sb.auth.updateUser({ password:pass });
      if (error) throw error;
      authMode = "in"; start();
    }
  } catch(err){ $("authErr").textContent = friendly(err.message); }
  btn.disabled = false; btn.textContent = label;
});
async function logout(msg){
  if (sb){ try { await sb.auth.signOut(); } catch(e){} }
  session = null; S = fresh(); try { localStorage.removeItem("storycv2"); } catch(e){}   // nothing personal stays on this device
  $("accModal").classList.remove("on"); setAuthMode("in"); go("auth");
  if (msg) $("authOk").textContent = msg;
}
$("logout").addEventListener("click", () => logout());
$("csLogout").addEventListener("click", () => logout());

/* ---------- Consent (UU PDP) ---------- */
const CONSENT_VERSION = "2026-10-11";   // date of the privacy policy and terms the user agreed to
const consentRecord = () => ({ consent_at:new Date().toISOString(), consent_version:CONSENT_VERSION });
const hasConsent = () => !!(session && session.user && (session.user.user_metadata || {}).consent_at);
function renderConsent(){
  applyTheme();
  $("csMascot").innerHTML = mascot("kopi", "think", 72);
  $("csErr").textContent = "";
}
$("csBtn").addEventListener("click", async () => {
  if (!$("cs-consent").checked){ $("csErr").textContent = T("a.eConsent"); return; }
  $("csBtn").disabled = true;
  try {
    const { error } = await sb.auth.updateUser({ data:consentRecord() });
    if (error) throw error;
    session = (await sb.auth.getSession()).data.session;
    start();
  } catch(e){ $("csErr").textContent = friendly(e.message); }
  $("csBtn").disabled = false;
});

$("accountBtn").addEventListener("click", () => {

  $("accErr").textContent = "";
  try {
    const data = await get("/api/account");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:"application/json" }));
    a.download = "ceritain-data-saya.json"; document.body.appendChild(a); a.click(); a.remove();
  } catch(e){ $("accErr").textContent = e.message; }
});
$("accDel").addEventListener("click", async () => {
  if (!confirm(T("a.accDelConfirm"))) return;
  $("accErr").textContent = ""; $("accDel").disabled = true;
  try { await api("/api/account", { method:"DELETE" }); await logout(T("a.accDeleted")); }
  catch(e){ $("accErr").textContent = e.message; }
  $("accDel").disabled = false;
});

  e.preventDefault();

  $("profErr").textContent = "";

  S.profile = { ...p, _buddy:S.buddy };
  if (changedBuddy){ S.messages = []; S.notes = {}; S.covered = {}; S.ready = false; S.resume = null; S.paid = false; S.cvId = null; }
  save(); go("chat");
});

/* ================= 3. Chat ================= */
function renderChat(typing){
  applyTheme();
  const b = BUDDIES[S.buddy];
  $("chatMascot").innerHTML = mascot(S.buddy, typing ? "think" : S.mood, 44);
  $("chatName").textContent = b.name;
  $("dots").innerHTML = AREAS.map((a) => `<span class="${S.covered[a] ? "on" : ""}"></span>`).join("");
  $("dots").setAttribute("aria-label", T("a.progress", { n: AREAS.filter((a)=>S.covered[a]).length, total: AREAS.length }));
  $("peek").textContent = T("a.myCv");
  $("peek").disabled = !S.resume; $("peek").style.opacity = S.resume ? 1 : .5;
  let h = "";
  S.messages.forEach((m, i) => {
    h += `<div class="m ${m.role === "user" ? "me" : "bot"}">${esc(m.content)}</div>`;
    if (S.notes[i]) h += `<div class="note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px"><path d="M20 6L9 17l-5-5"/></svg><span><b>${T("a.added")}</b>${esc(S.notes[i])}</span></div>`;
  });
  if (typing) h += `<div class="typing" aria-label="${T("a.typing", { name: b.name })}"><i></i><i></i><i></i></div>`;
  else if (S.suggestions.length) h += `<div class="chips">${S.suggestions.map((s) => `<button type="button" data-say="${esc(s)}">${esc(s)}</button>`).join("")}</div>`;
  $("msgs").innerHTML = h;
  $("msgs").querySelectorAll("[data-say]").forEach((el) => el.addEventListener("click", () => sendText(el.dataset.say)));
  $("msgs").scrollTop = $("msgs").scrollHeight;
  const answers = S.messages.filter((m) => m.role === "user").length;
  $("readyBar").classList.toggle("on", !typing && (S.ready || answers >= 8));
  $("readyText").textContent = S.ready ? T("a.ready", { nick: S.profile.nickname || T("a.friend") }) : T("a.enough");
  // Greet once when the chat opens. If that fails, show the error and wait (never retry in a loop).
  if (!typing && !S.messages.length && !busy && !$("chatErr").textContent) askBuddy();
}
let busy = false;
async function askBuddy(){
  if (busy) return; busy = true; $("chatErr").textContent = "";
  renderChat(true);
  try {
    const d = await post("/api/chat", { messages:S.messages, buddy:S.buddy, profile:S.profile });
    // A strong line from the user's last answer is shown right after that answer.
    if (d.cv_note && S.messages.length) S.notes[S.messages.length - 1] = d.cv_note;
    S.messages.push({ role:"assistant", content:d.reply });
    S.mood = d.mood || "happy"; S.suggestions = d.suggestions || []; S.covered = d.covered || {}; S.ready = !!d.ready;
    save();
  } catch(e){ $("chatErr").textContent = e.message; }
  busy = false; renderChat(false);
}
function sendText(text){
  text = (text || "").trim(); if (!text || busy) return;
  S.messages.push({ role:"user", content:text }); S.suggestions = []; save();
  $("input").value = ""; $("input").style.height = "";
  askBuddy();
}
$("composer").addEventListener("submit", (e) => { e.preventDefault(); sendText($("input").value); });
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendText($("input").value); } });
$("input").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
$("peek").addEventListener("click", () => S.resume && go("cv"));
$("restart").addEventListener("click", () => {
  if (!confirm(T("a.confirmRestart"))) return;
  S = fresh(); S.owner = session ? session.user.id : null; save(); go("pick");
});
$("create").addEventListener("click", async () => {
  $("chatErr").textContent = ""; $("create").disabled = true; $("create").textContent = T("a.writing");
  $("chatMascot").innerHTML = mascot(S.buddy, "think", 44);
  try {
    const d = await post("/api/resume", { messages:S.messages, profile:S.profile, buddy:S.buddy, cvId:S.cvId });
    S.resume = d.resume;
    if (d.cvId){ S.cvId = d.cvId; S.paid = !!d.paid; }   // saved in the account (demo mode keeps it on this device only)
    save(); go("cv");
  } catch(e){ $("chatErr").textContent = e.message; }
  $("create").disabled = false; $("create").textContent = T("a.create");
});

/* ================= 4. CV ================= */
const list = (a) => (Array.isArray(a) ? a.filter(Boolean) : []);
// Makes any CV (new format, older saved format, or slightly off AI output) fit one shape
function normCV(r){
  const bl = (x) => (typeof x === "string" ? { text:x, sub:[] } : { text:String((x && x.text) || ""), sub:list(x && x.sub).map(String) });
  const groups = (o) => { const g = list(o.groups).map((g) => ({ label:g.label || "", bullets:list(g.bullets).map(bl).filter((b) => b.text) })).filter((g) => g.bullets.length);
    return g.length ? g : [{ label:"", bullets:list(o.bullets).map(bl).filter((b) => b.text) }]; };
  const exp = list(r.experience).map((j) => j.roles
    ? { company:j.company || "", location:j.location || "", roles:list(j.roles).map((ro) => ({ title:ro.title || ro.role || "", start:ro.start || "", end:ro.end || "", groups:groups(ro) })) }
    : { company:j.company || "", location:j.location || "", roles:[{ title:j.role || "", start:j.start || "", end:j.end || "", groups:groups(j) }] });
  const edu = list(r.education).map((e) => ({ school:e.school || "", location:e.location || "", start:e.start || "", end:e.end || e.year || "",
    degree:e.degree || "", activities:list(e.activities).length ? list(e.activities) : (e.notes ? [e.notes] : []) }));
  return { name:r.name || "", contact:r.contact || {}, summary:r.summary || "", experience:exp, education:edu,
    skills:list(r.skills).length ? list(r.skills) : list(r.hard_skills), languages:list(r.languages), certifications:list(r.certifications) };
}
const span = (a, b) => [a, b].filter(Boolean).join(" - ");
const whenLine = (when, what) => [when, what].filter(Boolean).join(" | ");
function cvExtras(r){
  return [[CVH("Technical Skills"), r.skills], [CVH("Languages"), r.languages], [CVH("Certifications"), r.certifications]].filter(([,v]) => v.length);
}
function renderCV(){
  applyTheme();
  if (!S.resume) return go("chat");
  const r = normCV(S.resume), c = r.contact;
  $("cvMascot").innerHTML = mascot(S.buddy, "yay", 60);
  $("cvTitle").textContent = S.paid ? T("a.allYours", { nick: S.profile.nickname }) : T("a.cvReady", { nick: S.profile.nickname });
  const contact = [c.city, c.phone, c.email, c.linkedin].filter(Boolean).map(esc).join(" | ");
  let top = `<div class="r-name">${esc(r.name)}</div>`;
  if (contact) top += `<div class="r-contact">${contact}</div>`;
  if (r.summary) top += `<div class="r-sec">${CVH("Summary")}</div><p>${esc(r.summary)}</p>`;
  const ul = (bs) => `<ul>${bs.map((b) => `<li>${esc(b.text)}${b.sub.length ? `<ul>${b.sub.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</li>`).join("")}</ul>`;
  let rest = "";
  if (r.experience.length){
    rest += `<div class="r-sec">${CVH("Work Experience")}</div>`;
    r.experience.forEach((j) => {
      rest += `<div class="r-item"><div class="r-role">${esc([j.company, j.location].filter(Boolean).join(", "))}</div>`;
      j.roles.forEach((ro) => {
        rest += `<div class="r-when"><span class="r-date">${esc(span(ro.start, ro.end))}</span>${span(ro.start, ro.end) && ro.title ? " | " : ""}<i>${esc(ro.title)}</i></div>`;
        ro.groups.forEach((g) => { if (g.label) rest += `<div class="r-glabel">${esc(g.label)}</div>`; rest += ul(g.bullets); });
      });
      rest += `</div>`;
    });
  }
  if (r.education.length){
    rest += `<div class="r-sec">${CVH("Education")}</div>`;
    r.education.forEach((e) => {
      rest += `<div class="r-item"><div class="r-role">${esc([e.school, e.location].filter(Boolean).join(", "))}</div>
        <div class="r-when"><span class="r-date">${esc(span(e.start, e.end))}</span>${span(e.start, e.end) && e.degree ? " | " : ""}<i>${esc(e.degree)}</i></div>
        ${e.activities.length ? `<ul><li>${CVH("Activities")}:<ul>${e.activities.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></li></ul>` : ""}</div>`;
    });
  }
  const ex = cvExtras(r);
  if (ex.length) rest += `<div class="r-sec">${CVH("Additional Information")}</div><ul>${ex.map(([k,v]) => `<li><b>${k}:</b> ${v.map(esc).join(", ")}</li>`).join("")}</ul>`;
  $("paper").innerHTML = top + `<div class="blurme">${rest}</div>`;
  $("paperWrap").classList.toggle("locked", !S.paid);
  $("payBox").style.display = S.paid ? "none" : "block";
  $("paidBox").style.display = S.paid ? "flex" : "none";
}
$("redo").addEventListener("click", () => go("chat"));

/* ---------- Payment (TEST MODE) ----------
   Later: replace startPayment() with Midtrans Snap / Xendit, and only call onPaid()
   after the server confirms the payment. */
function startPayment(){ $("modal").classList.add("on"); $("fakePay").focus(); }
async function onPaid(){
  $("payErr").textContent = "";
  if (S.cvId){   // the server decides what's paid and only then sends the full CV
    $("fakePay").disabled = true;
    try { const d = await post("/api/pay", { cvId:S.cvId }); S.resume = d.resume; S.paid = !!d.paid; }
    catch(e){ $("payErr").textContent = e.message; $("fakePay").disabled = false; return; }
    $("fakePay").disabled = false;
  } else S.paid = true;   // demo mode
  save(); $("modal").classList.remove("on"); renderCV();
}
$("unlock").addEventListener("click", startPayment);
$("fakePay").addEventListener("click", onPaid);
$("cancelPay").addEventListener("click", () => $("modal").classList.remove("on"));
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) $("modal").classList.remove("on"); });

/* ---------- PDF: real text so hiring software (ATS) can read it ---------- */
$("download").addEventListener("click", () => {
  if (!S.resume || !S.paid || S.resume.locked) return;
  const r = normCV(S.resume);
  const hex = BUDDIES[S.buddy].theme.accent; const rgb = [1,3,5].map((i) => parseInt(hex.slice(i,i+2),16));
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"a4" });
  const M = 48, W = doc.internal.pageSize.getWidth() - M*2, H = doc.internal.pageSize.getHeight();
  const FS = 10;
  let y = M;
  const need = (h) => { if (y + h > H - M){ doc.addPage(); y = M; } };
  const text = (str, size, style, gap, indent, align) => {
    doc.setFont("helvetica", style || "normal"); doc.setFontSize(size);
    doc.splitTextToSize(String(str), W - (indent||0)).forEach((ln) => { need(size*1.3); doc.text(ln, align === "center" ? M + W/2 : M + (indent||0), y, align === "center" ? { align:"center" } : undefined); y += size*1.3; });
    y += gap || 0;
  };
  // filled dot for main points, hollow ring for sub points
  const bullet = (str, level) => { need(FS*1.3); const ind = level ? 30 : 13; doc.setDrawColor(20); doc.setFillColor(20); doc.setLineWidth(.7);
    doc.circle(M + ind - 8, y - 3.2, level ? 1.6 : 1.5, level ? "S" : "F"); text(str, FS, "normal", 1, ind); };
  const section = (t) => { y += 10; need(32); doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...rgb); doc.text(t.toUpperCase(), M, y); y += 4; doc.setDrawColor(200); doc.line(M, y, M+W, y); y += 13; doc.setTextColor(20); };
  // "Jul 2023 - Present | Role": date normal, role italic
  const when = (dates, what) => {
    need(FS*1.35); doc.setFontSize(FS); let x = M;
    if (dates){ doc.setFont("helvetica","normal"); doc.text(dates + (what ? "  |  " : ""), x, y); x += doc.getTextWidth(dates + (what ? "  |  " : "")); }
    if (what){ doc.setFont("helvetica","italic"); doc.text(doc.splitTextToSize(what, M + W - x)[0], x, y); }
    y += FS*1.35;
  };
  doc.setTextColor(20);
  text(r.name || CVH("Your Name"), 18, "bold", 2, 0, "center");
  const c = r.contact; const contact = [c.city, c.phone, c.email, c.linkedin].filter(Boolean).join("  |  ");
  if (contact) text(contact, 9, "normal", 2, 0, "center");
  if (r.summary){ section(CVH("Summary")); text(r.summary, FS); }
  if (r.experience.length){ section(CVH("Work Experience")); r.experience.forEach((j, i) => {
    if (i) y += 6;
    need(40); text([j.company, j.location].filter(Boolean).join(", "), 10.5, "bold", 1);
    j.roles.forEach((ro, k) => {
      if (k) y += 4;
      when(span(ro.start, ro.end), ro.title);
      ro.groups.forEach((g) => {
        if (g.label){ y += 2; text(g.label, FS, "bold", 1); }
        g.bullets.forEach((b) => { bullet(b.text, 0); b.sub.forEach((x) => bullet(x, 1)); });
      });
    });
  }); }
  if (r.education.length){ section(CVH("Education")); r.education.forEach((e, i) => {
    if (i) y += 6;
    need(30); text([e.school, e.location].filter(Boolean).join(", "), 10.5, "bold", 1);
    when(span(e.start, e.end), e.degree);
    if (e.activities.length){ bullet(CVH("Activities") + ":", 0); e.activities.forEach((x) => bullet(x, 1)); }
  }); }
  const ex = cvExtras(r);
  if (ex.length){ section(CVH("Additional Information")); ex.forEach(([k, v]) => bullet(k + ": " + v.join(", "), 0)); }
  doc.save((r.name || "CV").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_") + "_CV.pdf");
});

/* ================= Start ================= */
// Switching language redraws the screen you're on
document.addEventListener("langchange", () => { const on = document.querySelector(".screen.on"); if (on) go(on.id.slice(2)); });

// Start: switch on accounts if the server has them set up, then open the right screen.
function start(){
  if (session && S.owner !== session.user.id){ S = fresh(); S.owner = session.user.id; save(); }
  $("accountBtn").hidden = !session;
  if (S.screen === "auth") S.screen = "pick";
  const qb = new URLSearchParams(location.search).get("buddy");   // buddy chosen on the landing page
  if (qb && BUDDIES[qb] && !S.profile.name && !S.messages.length){ S.buddy = qb; save(); }
  go(S.screen === "chat" && !S.profile.name ? "pick" : S.screen);
  if (session) syncCv();
}
// The account is the source of truth: refresh this CV's paid status,
// or bring back the latest CV when this device has nothing (new phone, cleared browser).
async function syncCv(){
  try {
    const { cv } = await get("/api/cv" + (S.cvId ? "?id=" + encodeURIComponent(S.cvId) : ""));
    if (!cv) return;
    if (S.cvId){ S.resume = cv.resume; S.paid = cv.paid; save(); if (S.screen === "cv") renderCV(); return; }
    if (S.messages.length || S.resume) return;   // don't overwrite something in progress
    Object.assign(S, { cvId:cv.cvId, resume:cv.resume, paid:cv.paid, messages:cv.messages || [], buddy:BUDDIES[cv.buddy] ? cv.buddy : S.buddy,
      profile:{ ...(cv.profile || {}), _buddy:BUDDIES[cv.buddy] ? cv.buddy : S.buddy }, ready:true, covered:Object.fromEntries(AREAS.map((a) => [a, true])) });
    save(); go("cv");
  } catch(e){}
}
(async () => {
  let cfg = { auth:null, demo:false };
  try { cfg = await (await fetch("/api/config")).json(); } catch(e){}
  if (cfg.demo) $("demoBanner").style.display = "block";
  if (cfg.auth){
    if (!window.supabase){ document.body.insertAdjacentHTML("afterbegin", '<p class="error" style="padding:12px;text-align:center">' + T("a.noLogin") + '</p>'); return; }
    sb = window.supabase.createClient(cfg.auth.url, cfg.auth.anonKey);
    session = (await sb.auth.getSession()).data.session;
    sb.auth.onAuthStateChange((event, s) => {
      session = s;
      if (event === "PASSWORD_RECOVERY"){ authMode = "newpass"; go("auth"); }
      else if (event === "SIGNED_IN" && document.getElementById("s-auth").classList.contains("on") && authMode !== "newpass") start();
    });
  }
  start();
})();
