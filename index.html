<style>
  /* Hero */
  .hero{background:var(--bg);padding:64px 0 90px;position:relative;overflow:hidden;transition:background .4s}
  .hero .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:48px}
  .hero-text{flex:1 1 440px;min-width:0}
  .hero h1{font-size:clamp(42px,6.2vw,74px);font-weight:900;margin:18px 0}
  .hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
  .hero .fine{margin-top:14px;font-size:14px;font-weight:700;color:var(--muted)}
  .hero-demo{flex:1 1 440px;min-width:0;display:flex;justify-content:center;align-items:center;position:relative;min-height:640px}
  .dots-deco{position:absolute;inset:0;pointer-events:none}
  .dots-deco span{position:absolute;border-radius:50%;background:var(--pop);opacity:.6}
  .floaty{position:absolute;z-index:1}
  .demo-row{display:flex;align-items:flex-end;gap:18px;margin:0;position:relative}
  .phone{width:300px;height:560px;background:#fff;border-radius:40px;box-shadow:0 24px 60px rgba(31,35,64,.18);border:8px solid #1F2340;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:2}
  .ph-head{display:flex;align-items:center;gap:10px;padding:16px 14px 12px;border-bottom:1px solid var(--line)}
  .ph-head b{font-family:var(--head);font-size:16px}
  .ph-head small{display:block;font-size:11px;color:var(--muted);font-weight:700}
  .ph-msgs{flex:1;background:var(--bg);padding:14px 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;overflow:hidden;transition:background .4s}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes blink{50%{opacity:1}}
  .b{max-width:84%;padding:10px 13px;font-size:14px;line-height:1.4;animation:pop .3s ease-out}
  .b.bot{align-self:flex-start;background:#fff;border-radius:var(--bub);border:var(--bd);box-shadow:var(--sh)}
  .b.me{align-self:flex-end;background:var(--accent);color:#fff;border-radius:var(--me);border:var(--bd)}
  .b.note{align-self:flex-start;background:var(--pop);color:var(--pop-ink);border-radius:12px;font-size:12.5px;font-weight:800}
  .typing{align-self:flex-start;background:#fff;border-radius:18px;padding:12px 14px;display:flex;gap:4px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.35;animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  .ph-input{display:flex;gap:8px;padding:10px 12px 16px;border-top:1px solid var(--line)}
  .ph-input span{flex:1;height:40px;border-radius:20px;background:#F1F3FB;font-size:13px;color:#8A8FA8;display:flex;align-items:center;padding:0 14px}
  .ph-input i{width:40px;height:40px;border-radius:50%;background:var(--accent)}
  .cv-card{position:relative;flex:none;align-self:flex-end;margin-bottom:40px;width:210px;background:#fff;border-radius:14px;box-shadow:0 18px 40px rgba(31,35,64,.16);padding:16px 16px 18px;font-family:'Source Serif 4',serif;z-index:3;transform:rotate(3deg)}
  .cv-card .nm{font-weight:700;font-size:17px}
  .cv-card .hd{font-family:'Nunito',sans-serif;font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--accent);margin-top:10px;border-bottom:1px solid var(--line);padding-bottom:3px}
  .cv-card .ln{font-size:12px;line-height:1.45;margin-top:5px;min-height:17px}
  .cv-card .ln.ph{height:8px;min-height:0;border-radius:4px;background:#EEF0F7;margin-top:9px}
  .cv-card .ln.new{animation:pop .4s ease-out}
  .ready-badge{position:absolute;left:-46px;top:-20px;background:#fff;border-radius:999px;padding:8px 14px;font-weight:900;font-size:13px;box-shadow:0 10px 24px rgba(31,35,64,.14);z-index:3;display:flex;align-items:center;gap:6px;transform:rotate(-4deg)}
  @media (max-width:620px){
    .demo-row{flex-direction:column;align-items:center} .cv-card{width:260px;margin:0;align-self:center;transform:rotate(-1.5deg)}
    .ready-badge{left:-6px;top:-18px} .hero-demo{min-height:560px} .phone{width:290px;height:540px} .floaty,.dots-deco{display:none}
  }

  /* 3 steps */
  .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:44px}
  .s3{background:var(--bg);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:10px;transition:background .4s}
  .s3-num{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}
  .s3 h3{font-size:26px}
  .s3 p{margin:0;color:var(--muted);font-size:16px}
  .s3-art{background:#fff;border-radius:18px;padding:16px;margin-top:auto;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:8px}
  .s3-art .mb{font-size:14px;padding:9px 12px;max-width:85%}

  .s3-art .mb.me{align-self:flex-end;background:var(--accent);color:#fff;border-radius:var(--me)}
  .s3-art .say2{align-self:flex-start;font-weight:700;font-size:15px;background:#F3F4F8;border-radius:14px;padding:8px 12px}
  .s3-art .arrow{align-self:center;color:var(--accent);font-weight:900;font-size:20px;line-height:1}
  .s3-art .cvline{background:var(--pop);color:var(--pop-ink);font-weight:800;font-size:14px;border-radius:14px;padding:9px 12px}
  @media (max-width:860px){ .three{grid-template-columns:minmax(0,1fr)} }

  /* Explore links */

  .ex{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:22px;border-radius:24px;border:2px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .15s,border-color .2s}
  .ex:hover{transform:translateY(-4px);border-color:var(--accent);color:var(--ink)}
  .ex b{font-family:var(--head);font-size:21px;margin-top:6px}
  .ex b::after{content:" →";color:var(--accent)}
  .ex .d{color:var(--muted);font-size:15px}
  @media (max-width:760px){ .explore{grid-template-columns:minmax(0,1fr)} }

<script src="/lib/site.js"></script>
<script>
const { BUDDIES, mascot } = window.StoryBuddies;
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let timers = [];
const later = (ms, fn) => timers.push(setTimeout(fn, ms));

function decorate(){
  const id = StorySite.current, others = Object.keys(BUDDIES).filter((k) => k !== id);
  $("floatA").innerHTML = mascot(others[0], "wink", 74);
  $("floatB").innerHTML = mascot(others[1], "happy", 64);
  $("finalCta").textContent = I18N.t("home.finalCta", { name: BUDDIES[id].name });
}
function restartDemo(){
  timers.forEach(clearTimeout); timers = [];
  const cur = StorySite.current, L = DEMO[I18N.lang], lines = L[cur], box = $("phMsgs");
  $("phMascot").innerHTML = mascot(cur, "happy", 38);
  $("phName").textContent = BUDDIES[cur].name; $("phRole").textContent = BUDDIES[cur].role;
  $("badgeMascot").innerHTML = mascot(cur, "think", 26); $("badgeText").textContent = I18N.t("home.badgeWriting");
  box.innerHTML = "";
  ["cv0","cv1","cv2"].forEach((id) => { const el = $(id); el.className = "ln ph"; el.textContent = ""; });
  const add = (cls, text) => { const d = document.createElement("div"); d.className = "b " + cls; d.textContent = text; box.appendChild(d); while (box.children.length > 7) box.firstChild.remove(); };
  const typing = () => { const d = document.createElement("div"); d.className = "typing"; d.innerHTML = "<i></i><i></i><i></i>"; box.appendChild(d); return d; };
  const fill = (i) => { const el = $("cv" + i); el.className = "ln new"; el.textContent = (i ? "• " : "") + L.notes[i]; };
  if (reduce){ add("bot", lines[0]); add("me", L.user[0]); add("note", I18N.t("home.added")); add("bot", lines[3]); [0,1,2].forEach(fill); $("badgeText").textContent = I18N.t("home.badgeDone"); return; }
  let t = 400;
  for (let i = 0; i < 3; i++){
    later(t, () => { const ty = typing(); later(900, () => { ty.remove(); add("bot", lines[i]); $("phMascot").innerHTML = mascot(cur, i ? "think" : "happy", 38); }); }); t += 1700;
    later(t, () => add("me", L.user[i])); t += 900;
    later(t, () => { add("note", I18N.t("home.added")); fill(i); $("phMascot").innerHTML = mascot(cur, "wink", 38); }); t += 1300;
  }
  later(t, () => { const ty = typing(); later(800, () => { ty.remove(); add("bot", lines[3]); $("phMascot").innerHTML = mascot(cur, "yay", 38); $("badgeMascot").innerHTML = mascot(cur, "yay", 26); $("badgeText").textContent = I18N.t("home.badgeDone"); }); });
  t += 4200;
  later(t, restartDemo);
}
document.addEventListener("buddychange", () => { decorate(); restartDemo(); });
document.addEventListener("langchange", () => { decorate(); restartDemo(); });
decorate(); restartDemo();
</script>
