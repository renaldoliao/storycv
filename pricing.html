<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harga &amp; FAQ · Ceritain</title>
<meta name="t-title" content="p.title">
<meta name="description" content="Ngobrol gratis. Bayar sekali per CV buat download PDF ramah ATS. Tanpa langganan.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M22 54 L28 12 L56 34 Z M98 54 L92 12 L64 34 Z' fill='%23FFC93C'/%3E%3Cellipse cx='60' cy='70' rx='47' ry='40' fill='%23FFC93C'/%3E%3Ccircle cx='43' cy='64' r='7' fill='%231F2340'/%3E%3Ccircle cx='77' cy='64' r='7' fill='%231F2340'/%3E%3Cpath d='M55 74 H65 L60 80 Z' fill='%23F07A8E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="/lib/site.css">

<style>
  .plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:900px;margin:44px auto 0}
  .plan{border-radius:32px;padding:30px;border:2px solid var(--line);display:flex;flex-direction:column;gap:14px;position:relative;background:#fff}
  .plan.main{border-color:var(--accent);background:var(--soft);transition:background .4s}
  .plan .peek{position:absolute;top:-46px;right:24px}
  .plan .amt{font-family:var(--head);font-size:48px;font-weight:900;line-height:1}
  .plan ul{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:10px}
  .plan li{display:flex;gap:10px;align-items:flex-start;font-weight:700}
  .plan li svg{flex:none;margin-top:3px;color:var(--accent)}
  .plan .btn{margin-top:auto}
  @media (max-width:760px){ .plans{grid-template-columns:minmax(0,1fr)} .plan .peek{top:-40px} }
  .compare{display:flex;flex-wrap:wrap;gap:28px;align-items:center;background:var(--bg);border-radius:32px;padding:30px;margin-top:28px;transition:background .4s}
  .compare .cbox{flex:1 1 360px;min-width:0}
  .vsrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
  .vsrow div{flex:1 1 140px;background:#fff;border-radius:18px;padding:14px;text-align:center;font-weight:800}
  .vsrow div b{display:block;font-family:var(--head);font-size:26px;color:var(--accent)}
  .pay{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
  .pay span{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px}
  .faqwrap{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
  .faqwrap .faq-list{flex:1 1 520px;min-width:0}
  .faqside{flex:0 1 300px;display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:110px}
  @media (max-width:860px){ .faqside{position:static} }
</style>
</head>
<body>
<div id="siteNav"></div>

<main>
  <header class="phero">
    <div class="wrap">
      <div class="txt">
        <span class="eyebrow" data-t="p.eye"></span>
        <h1 data-t="p.h1"></h1>
        <p class="lead" data-t="p.lead"></p>
      </div>
      <div class="art" aria-hidden="true">
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
          <div class="say pop" style="max-width:220px" data-t="p.kira"></div>
          <span class="bob" data-m="kira yay 180"></span>
        </div>
      </div>
    </div>
  </header>

  <section>

            <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-t="p.f1"></span></li>

            <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-t="p.p1"></span></li>
            <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-t="p.p2"></span></li>
            <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-t="p.p3"></span></li>
            <li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span data-t="p.p4"></span></li>
          </ul>
          <a class="btn startLink" href="/app" data-t="p.make"></a>
        </div>
      </div>

      <div class="compare reveal">
        <span data-m="kopi think 110" aria-hidden="true"></span>
        <div class="cbox">
          <h3 data-t="p.whyH"></h3>
          <p class="muted" style="margin:8px 0 0" data-t="p.whyP"></p>
          <div class="vsrow">
            <div data-t="p.v1"></div>
            <div data-t="p.v2"></div>
            <div data-t="p.v3"></div>
          </div>
        </div>
      </div>
      <div class="center reveal" style="margin-top:22px">
        <div class="muted" style="font-weight:800" data-t="p.payWith"></div>
        <div class="pay"><span>QRIS</span><span>GoPay</span><span>OVO</span><span>DANA</span><span>ShopeePay</span></div>
      </div>
    </div>
  </section>

  <section style="background:#FAFAFD" id="faq">
    <div class="wrap">
      <div class="center reveal" style="margin-bottom:36px"><span class="eyebrow">FAQ</span><h2 style="margin-top:14px" data-t="p.faqH"></h2></div>
      <div class="faqwrap">
        <div class="faqside reveal" aria-hidden="true">
          <div class="say" style="max-width:240px" data-t="p.faqKira"></div>
          <span class="bob" data-m="kira happy 150"></span>
        </div>
        <div class="faq-list">
          <details class="reveal"><summary data-t="p.q1"></summary><p data-t="p.a1"></p></details>
          <details class="reveal"><summary data-t="p.q2"></summary><p data-t="p.a2"></p></details>
          <details class="reveal"><summary data-t="p.q3"></summary><p data-t="p.a3"></p></details>
          <details class="reveal"><summary data-t="p.q4"></summary><p data-t="p.a4"></p></details>
          <details class="reveal"><summary data-t="p.q5"></summary><p data-t="p.a5"></p></details>
          <details class="reveal"><summary data-t="p.q6"></summary><p data-t="p.a6"></p></details>
          <details class="reveal"><summary data-t="p.q7"></summary><p data-t="p.a7"></p></details>
          <details class="reveal"><summary data-t="p.q8"></summary><p data-t="p.a8"></p></details>
        </div>
      </div>
    </div>
  </section>

  <section class="final" style="padding-top:72px">
    <div class="wrap">
      <div class="final-box reveal">
        <div class="wave" id="wave"></div>
        <h2 data-t="p.finalH"></h2>
        <p data-t="p.finalP"></p>
        <a class="btn startLink" href="/app" data-t="p.finalCta"></a>
      </div>
    </div>
  </section>
</main>

<div id="siteFooter"></div>
